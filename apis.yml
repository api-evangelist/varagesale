aid: varagesale
name: Varagesale
description: 'VarageSale is a community-based online marketplace for buying and selling
  used items locally, founded in 2012 by Montreal teacher Tami Zuckerman and programmer
  Carl Mercier and headquartered in Toronto, Ontario. Members join a local community,
  verify their identity, and buy and sell with verified neighbors through native iOS
  and Android apps and the web, with communities across North America and beyond.
  Backed by Sequoia Capital and Lightspeed Venture Partners, VarageSale was acquired
  by VerticalScope in 2017, with online auction company MaxSold assuming operational
  control in early 2026. It is a direct-to-consumer marketplace and does not publish
  a public developer API, so this record captures its identity, web properties, and
  domain-security posture.'
